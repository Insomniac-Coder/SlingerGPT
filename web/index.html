<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SlingerGPT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M17.3 17.3A7.5 7.5 0 1 1 17.3 6.7' fill='none' stroke='%23a07a35' stroke-width='2.4' stroke-linecap='round'/%3E%3Cellipse cx='17.3' cy='6.7' rx='3.2' ry='2.5' transform='rotate(45 17.3 6.7)' fill='%23404a4e'/%3E%3C/svg%3E">
  <script>
    // The saved theme before first paint, so the page never flashes the wrong colours.
    try { const t = localStorage.getItem('modelchat.theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="app.css?v=3">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Chats">
      <div class="side-top">
        <div class="brand">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.3 17.3A7.5 7.5 0 1 1 17.3 6.7"/><ellipse cx="17.3" cy="6.7" rx="3.2" ry="2.5" transform="rotate(45 17.3 6.7)"/></svg>
          <span>SlingerGPT</span>
        </div>
        <button class="icon-btn" id="close-side" aria-label="Close sidebar" title="Close sidebar">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
        </button>
      </div>
      <button class="side-item new" id="new-chat">
        <svg viewBox="0 0 24 24"><path d="M15.5 5.5l3 3L8 19H5v-3zM13.5 7.5l3 3"/></svg>New chat
      </button>
      <h2 class="side-label">Chats</h2>
      <nav class="chat-list" id="chat-list"></nav>
      <div class="side-bottom">
        <button class="side-item" id="theme">
          <svg viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg><span>Switch theme</span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main">
      <header class="top">
        <button class="icon-btn" id="open-side" aria-label="Open sidebar" title="Open sidebar">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
        </button>
        <button class="model-btn" id="model-btn" popovertarget="model-menu" aria-haspopup="menu">
          <span id="model-name">Loading models…</span><span class="model-size" id="model-size"></span>
          <svg viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></svg>
        </button>
        <div class="spacer"></div>
        <button class="icon-btn" id="settings-btn" popovertarget="settings" aria-label="Reply settings" title="Reply settings">
          <svg viewBox="0 0 24 24"><path d="M4.5 6.5h9M17.5 6.5h2M4.5 12h3M11.5 12h8M4.5 17.5h9M17.5 17.5h2"/><circle cx="15.5" cy="6.5" r="2"/><circle cx="9.5" cy="12" r="2"/><circle cx="15.5" cy="17.5" r="2"/></svg>
        </button>
      </header>

      <div class="menu" id="model-menu" popover role="menu" aria-label="Models"></div>

      <form class="menu settings" id="settings" popover>
        <h3>Reply settings</h3>
        <label>Temperature <output id="temperature-out"></output>
          <input type="range" name="temperature" min="0.1" max="1.5" step="0.05">
          <small>Lower is safer and plainer; higher is more varied and more random.</small></label>
        <label>Top-k <output id="top_k-out"></output>
          <input type="range" name="top_k" min="0" max="200" step="5">
          <small>Picks only from the k likeliest next tokens. 0 means no limit.</small></label>
        <label>Reply length <output id="words-out"></output>
          <input type="range" name="words" min="10" max="400" step="10">
          <small>Most words a reply may have. Replies usually end sooner, when the model finishes its turn.</small></label>
        <label>Anti-repetition <output id="dry-out"></output>
          <input type="range" name="dry" min="0" max="1.5" step="0.1">
          <small>Lowers the odds of copying a phrase it already wrote (DRY). 0 is off; 0.8 is typical.</small></label>
        <button type="button" class="text-btn" id="reset-settings">Reset to defaults</button>
      </form>

      <section class="scroll" id="scroll">
        <div class="thread" id="thread" aria-live="polite"></div>
        <div class="hero" id="hero">
          <h1 id="hero-title">Take your shot.</h1>
          <p id="hero-sub"></p>
        </div>
      </section>

      <div class="dock">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask SlingerGPT" aria-label="Message"></textarea>
          <div class="composer-bar">
            <div class="mode" role="radiogroup" aria-label="How the model reads your message">
              <button type="button" role="radio" data-mode="chat" title="Your messages and its replies become a conversation; it answers you">Chat</button>
              <button type="button" role="radio" data-mode="continue" title="Your text is the start of a document; it carries on writing">Continue<span class="mode-more"> writing</span></button>
            </div>
            <button type="button" class="lookup" id="lookup" aria-pressed="false" hidden
                    title="Search the Wikipedia copy on this PC first, and answer from what it finds">
              <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4.5 4.5"/></svg><span>Look it up</span>
            </button>
            <label class="context" id="context" hidden>
              <span class="context-word">Context</span> <span id="context-label"></span>
              <meter id="context-meter" min="0" optimum="0"></meter>
            </label>
            <button class="send" id="send" type="submit" aria-label="Send" title="Send">
              <svg class="arrow" viewBox="0 0 24 24"><path d="M12 19V5.5M6 11.5l6-6 6 6"/></svg>
              <svg class="square" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
            </button>
          </div>
        </form>
        <div class="starters" id="starters"></div>
        <p class="note">Small models, trained on this laptop. They can miss, so check anything that matters.</p>
      </div>
    </main>
  </div>
  <script src="app.js?v=3"></script>
</body>
</html>
